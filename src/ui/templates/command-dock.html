  <!-- Unified bottom command dock: locations, voice (injected at runtime), visual presets -->
  <div id="command-dock" aria-label="Navigation, voice, and visual preset controls">
  <!-- Control panel -->
  <div id="control-panel" class="panel-collapsible collapsed">
    <div class="panel-glow"></div>
    <div class="panel-inner">
      <button id="control-panel-toggle" class="panel-header dock-tray-toggle" type="button"
        data-dock-toggle-target="control-panel" aria-expanded="false"
        aria-controls="control-panel-popover" aria-label="Expand Visual Presets">
        <span class="panel-title"><span class="dock-label-icon dock-label-icon-presets" aria-hidden="true"></span>视觉风格</span>
        <span class="panel-divider"></span>
      </button>
      <div id="control-panel-popover" class="dock-popover-content">
      <button class="dock-pin-btn" data-pin-target="control-panel" type="button" aria-label="Pin visual presets" aria-pressed="false" title="Keep visual presets open"><img src="/pin.svg" alt="" /></button>
      <div id="style-buttons" class="button-grid">
        <button class="style-btn active" data-style="normal" title="无滤镜显示地球。">
          <span class="btn-icon">◯</span>
          <span class="btn-label">标准</span>
          <span class="btn-key">1</span>
        </button>
        <button class="style-btn" data-style="retro" title="模拟绿色荧光 CRT 显示器，带扫描线和屏幕曲面。">
          <span class="btn-icon">▦</span>
          <span class="btn-label">复古 CRT</span>
          <span class="btn-key">2</span>
        </button>
        <button class="style-btn" data-style="surveillance" title="模拟夜视仪，绿色增强带暗角。">
          <span class="btn-icon">🌙</span>
          <span class="btn-label">夜视</span>
          <span class="btn-key">3</span>
        </button>
        <button class="style-btn" data-style="thermal" title="模拟 FLIR 热成像对比度。">
          <span class="btn-icon">🌡️</span>
          <span class="btn-label">热成像</span>
          <span class="btn-key">4</span>
        </button>
        <button class="style-btn" data-style="anime" title="明亮的赛璐璐着色与插画描边。">
          <span class="btn-icon">✦</span>
          <span class="btn-label">动漫</span>
          <span class="btn-key">5</span>
        </button>
        <button class="style-btn" data-style="noir" title="高对比黑白胶片质感。">
          <span class="btn-icon">◐</span>
          <span class="btn-label">黑白</span>
          <span class="btn-key">6</span>
        </button>
        <button class="style-btn" data-style="snow" title="冷色调雪景白化处理。">
          <span class="btn-icon">❄</span>
          <span class="btn-label">雪景</span>
          <span class="btn-key">7</span>
        </button>
      </div>
      <section class="map-source-section" aria-labelledby="map-source-label">
        <div class="map-source-heading">
          <span id="map-source-label">地图源</span>
          <span id="map-stack-status" class="pp-stack-status" aria-live="polite">3D</span>
        </div>
        <div id="map-stack-chips" class="map-stack-chip-row" role="group" aria-label="地图源"></div>
      </section>
      </div>
      <div id="style-mini-status" class="panel-mini-status" aria-live="polite">
        <span class="panel-mini-label">风格</span>
        <span id="style-mini-value" class="panel-mini-value">标准</span>
      </div>
    </div>
  </div>

  <!-- Location bar -->
  <div id="location-bar" class="panel-collapsible collapsed">
    <div class="panel-glow"></div>
    <div class="location-inner">
      <div class="location-toolbar">
        <button id="location-bar-toggle" class="dock-tray-toggle" type="button" data-dock-toggle-target="location-bar" aria-controls="location-bar-popover" aria-expanded="false" aria-label="Expand LOCATION" title="Expand LOCATION">
          <span class="location-toolbar-label"><span class="dock-label-icon dock-label-icon-location" aria-hidden="true"></span>位置</span>
        </button>
        <button class="panel-collapse-btn" data-collapse-target="location-bar" title="收起面板">+</button>
      </div>
      <div id="location-mini-status" class="location-mini-status" aria-live="polite">
        <div id="location-mini-city" class="location-mini-city">📍 位置：--</div>
        <div id="location-mini-poi" class="location-mini-poi">地标：--</div>
      </div>
      <div id="location-bar-popover" class="dock-popover-content">
        <button class="dock-pin-btn" data-pin-target="location-bar" type="button" aria-label="固定位置栏" aria-pressed="false" title="保持位置栏展开"><img src="/pin.svg" alt="" /></button>
        <div id="poi-row" class="poi-row-container"></div>
        <div class="location-bar-divider" id="location-bar-divider"></div>
        <div class="location-city-row">
          <div id="location-pills" class="location-pills"></div>
          <div class="location-search-wrap">
            <button id="search-toggle" class="search-toggle-btn" title="搜索任意位置">
              <span>&#x1F50E;</span>
            </button>
            <input type="text" id="location-search" placeholder="搜索任意位置..." autocomplete="off" spellcheck="false" aria-label="按名称或坐标搜索位置" />
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
